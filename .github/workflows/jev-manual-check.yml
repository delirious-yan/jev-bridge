name: JEV manual checks

# Manual only. Private Actions minutes are exhausted until the owner's quota resets.
# No pull_request/push events, no owner self-hosted runner, no automatic JEV traffic.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Offline tests use no secret. Live synthetic uses one potentially billable JEV request."
        required: true
        default: offline-tests
        type: choice
        options:
          - offline-tests
          - live-synthetic

permissions:
  contents: read

concurrency:
  group: jev-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-tests:
    if: inputs.mode == 'offline-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm test

  live-synthetic:
    if: inputs.mode == 'live-synthetic'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Offline regressions before one live request
        run: npm test
      - name: One synthetic, read-only JEV call (owner-approved only)
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_ALLOW_LIVE: YES_LIVE_CALL
        run: npm run smoke
